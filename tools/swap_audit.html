<!doctype html>
<meta charset="utf-8" />
<title>Helm — 360 swap audit</title>
<style>
  body { margin:0; background:#0b0c10; color:#e8eaf0; font:13px/1.5 system-ui, sans-serif; }
  #stage { width:100%; height:56vh; position:relative; background:#000; }
  #log { padding:12px 16px; }
  table { border-collapse:collapse; font-size:12px; }
  td,th { border:1px solid #2a2d38; padding:3px 7px; text-align:left; }
  .ok { color:#5ad18b; } .bad { color:#ff6b6b; }
  #bar { padding:8px 16px; display:flex; gap:8px; align-items:center; }
  button { background:#e5a93b; border:0; border-radius:6px; padding:7px 14px; font:inherit; cursor:pointer; }
</style>
<div id="stage"></div>
<div id="bar">
  <button id="run">Run full swap audit</button>
  <span id="status">idle</span>
</div>
<div id="log"></div>
<script type="module" src="/tools/swap_audit.js"></script>
