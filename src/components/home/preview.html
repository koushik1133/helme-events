<!doctype html>
<html data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home screen preview</title>
  <link rel="stylesheet" href="/src/style.css" />
  <style>
    body { margin: 0; background: var(--bg-app); }
    #bar { position: sticky; top: 0; z-index: 99; display: flex; gap: 8px; padding: 10px 16px;
           background: var(--bg-nav); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-subtle); }
    #bar button { padding: 6px 12px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 13px;
                  background: var(--bg-pill); color: var(--text-main); border: 1px solid var(--border-subtle); }
  </style>
</head>
<body>
  <div id="bar"></div>
  <div id="host"></div>
  <script type="module">
    /* Dev-only harness: mounts the home screen against the REAL crm store,
       session and permission matrix so the four variants can be eyeballed.
       Not an entry point — Vite only builds index.html. */
    import { HomeScreen } from '/src/components/home/HomeScreen.js';
    import { crmStore } from '/src/crm/store.js';
    import * as finance from '/src/crm/finance.js';
    import { session } from '/src/auth/session.js';
    import { can } from '/src/auth/permissions.js';

    const empties = { deals: () => [], clients: () => [], milestones: () => [], receipts: () => [], invoices: () => [], activity: () => [] };
    let useEmpty = false;
    const host = document.getElementById('host');
    function paint() {
      new HomeScreen(host, {
        store: useEmpty ? empties : crmStore,
        finance, session, can,
        navigate: (r, p) => console.log('navigate', r, p)
      }).render();
    }
    const bar = document.getElementById('bar');
    ['admin', 'sales_manager', 'event_manager', 'finance'].forEach(role => {
      const b = document.createElement('button'); b.textContent = role;
      b.onclick = () => { session.switchRole(role); paint(); }; bar.appendChild(b);
    });
    const t = document.createElement('button'); t.textContent = 'theme';
    t.onclick = () => document.documentElement.setAttribute('data-theme',
      document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    bar.appendChild(t);
    const e = document.createElement('button'); e.textContent = 'empty';
    e.onclick = () => { useEmpty = !useEmpty; paint(); }; bar.appendChild(e);
    session.switchRole('admin');
    paint();
  </script>
</body>
</html>
