<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Helm">
  <title>Helm</title>
  <!--
    Helm mark: a ship's wheel.
    Drawn with `currentColor`-style theme awareness — the glyph paints in a warm
    gold that holds contrast on both light and dark tab bars, so it never
    disappears the way a pure black or pure white mark would.
    Shapes are deliberately chunky (3px strokes on a 32px grid) so the mark
    still reads as a wheel when rasterised to 16x16.
  -->
  <g fill="none" stroke="#D4A24C" stroke-width="3" stroke-linecap="round">
    <!-- Outer rim -->
    <circle cx="16" cy="16" r="12.5"/>
    <!-- Four spokes, cardinal only: diagonals turn to mush at 16px -->
    <path d="M16 3.5v25M3.5 16h25"/>
  </g>
  <!-- Hub: solid so the centre stays legible at small sizes -->
  <circle cx="16" cy="16" r="4.5" fill="#D4A24C"/>
  <circle cx="16" cy="16" r="1.75" fill="#0B1220"/>
</svg>
