<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helme Events 360° | India Events & Venue Visualizer</title>

  <!-- Google Fonts: Inter (Helme Events Font Stack) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Pannellum 360 Panorama Viewer CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- Helme Events Navbar Header -->
  <header class="app-navbar">
    <div class="nav-brand">
      <div class="logo-badge">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20" />
          <path d="M2 12h20" />
        </svg>
      </div>
      <div class="brand-text">
        <h1 class="logo-title">Helme Events 360°</h1>
        <span class="logo-subtitle">Venue & India Events Studio</span>
      </div>
    </div>

    <!-- Navigation View Switcher (Center Segmented Pill) -->
    <div class="view-toggle-group">
      <button class="nav-tab active" id="tabMapView"><span>📍 Map</span></button>
      <button class="nav-tab" id="tab360View"><span>🌀 360°</span></button>
      <button class="nav-tab nav-tab-india" id="tabIndiaView"><span>🇮🇳 India</span></button>
      <button class="nav-tab" id="tabFloorPlanView"><span>📐 Floor Plan</span></button>
      <button class="nav-tab" id="tabAnalyticsView"><span>📊 Analytics</span></button>
      <button class="nav-tab" id="tabProposalsView"><span>📁 Proposals</span></button>
      <button class="nav-tab" id="tabTimelineView"><span>📅 Timeline</span></button>
      <button class="nav-tab" id="tabSeatingView"><span>👥 Seating</span></button>
    </div>

    <!-- Action Buttons Group (Right Pill Bar) -->
    <div class="nav-actions-group">
      <button class="nav-action-btn btn-custom-brief" id="btnCustomBrief" title="Dynamic Custom Event Setup Wizard">
        <span>📋 Custom Brief</span>
      </button>

      <button class="nav-action-btn btn-ai-builder" id="btnAIBuilder" title="1-Click Mega Event Auto-Builder">
        <span>⚡ AI Builder</span>
      </button>

      <button class="nav-action-btn btn-features-toggle" id="btnToggleFeatures" title="More Features">
        <span>🧩 Features</span>
      </button>

      <button class="nav-action-btn btn-venue-menu" id="btnOpenVenueMenu">
        <span>📖 Menu</span>
      </button>

      <button class="nav-action-btn btn-cart-nav" id="btnOpenCart">
        <span>🛒 Cart</span>
      </button>

      <button class="nav-action-btn btn-notification-bell" id="btnNotifications" title="Notifications">
        <span>🔔</span>
        <span class="notif-badge" id="notifBadge">3</span>
      </button>

      <button class="nav-action-btn btn-sound-toggle" id="btnSoundToggle">
        <span id="soundIcon">🔊</span> <span id="soundLabel">Sound: OFF</span>
      </button>

      <button class="theme-mode-toggle" id="themeModeToggle" aria-label="Toggle Theme">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
        <span class="theme-mode-label">Dark</span>
      </button>

      <div class="preset-dropdown-wrapper">
        <span class="preset-dropdown-label">Theme:</span>
        <div class="preset-select-container">
          <select id="presetSelect" class="preset-select" aria-label="Select Theme Preset">
            <option value="royal">👑 Royal Gold</option>
            <option value="cyber">⚡ Cyber Neon</option>
            <option value="garden">🌿 Garden Boho</option>
            <option value="minimal">🤍 Minimalist</option>
          </select>
          <span class="preset-chevron-icon" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </span>
        </div>
      </div>
    </div>
  </header>

  <!-- Secondary Feature Toolbar (toggled by Features button) -->
  <div id="featureToolbar" class="feature-toolbar hidden">
    <div class="feature-toolbar-scroll">
      <button class="feature-btn" data-feature="colorTheme"><span>🎨 Colors</span></button>
      <button class="feature-btn" data-feature="compare"><span>📸 Compare</span></button>
      <button class="feature-btn" data-feature="collab"><span>🤝 Collaborate</span></button>
      <button class="feature-btn" data-feature="styles"><span>💐 Styles</span></button>
      <button class="feature-btn" data-feature="vendors"><span>📊 Vendors</span></button>
      <button class="feature-btn" data-feature="inventory"><span>📦 Inventory</span></button>
      <button class="feature-btn" data-feature="calendar"><span>📆 Calendar</span></button>
      <button class="feature-btn" data-feature="notes"><span>💬 Notes</span></button>
      <button class="feature-btn" data-feature="revenue"><span>📈 Revenue</span></button>
      <button class="feature-btn" data-feature="weather"><span>🌦️ Weather</span></button>
      <button class="feature-btn" data-feature="videoExport"><span>🎬 Export Video</span></button>
      <button class="feature-btn" data-feature="arQR"><span>✨ AR QR</span></button>
      <button class="feature-btn" data-feature="playlist"><span>🎵 Playlist</span></button>
      <button class="feature-btn" data-feature="moodBoard"><span>🖼️ Mood Board</span></button>
      <button class="feature-btn" data-feature="testimonials"><span>⭐ Reviews</span></button>
      <button class="feature-btn" data-feature="contract"><span>📜 Contract</span></button>
      <button class="feature-btn" data-feature="invoice"><span>🧾 Invoice</span></button>
      <button class="feature-btn" data-feature="budgetAI"><span>🤖 Budget AI</span></button>
      <button class="feature-btn" data-feature="briefGen"><span>📝 Brief</span></button>
    </div>
  </div>

  <!-- Secondary Sub-Bar for India Events Mode Selection -->
  <div id="indiaSubBar" class="india-sub-bar hidden">
    <div class="sub-bar-content">
      <span class="sub-bar-label">Select Event Type:</span>
      <div class="india-mode-toggle-group">
        <button class="india-mode-btn active" data-mode="election"><span>🗳️ Election Rally</span></button>
        <button class="india-mode-btn" data-mode="function"><span>🌺 Grand Function / Mandap</span></button>
        <button class="india-mode-btn" data-mode="meeting"><span>💼 Public Summit Meeting</span></button>
      </div>
    </div>
  </div>

  <!-- Main Viewport -->
  <main class="app-viewport">
    <!-- View 1: Interactive Aerial Venue Map -->
    <section id="mapViewContainer" class="view-section active"></section>

    <!-- View 2: Full 360° Photo WebGL Studio -->
    <section id="studio360Container" class="view-section hidden">
      <div id="canvas360Holder" class="canvas-360-holder"></div>
      <div class="hud-top-bar">
        <button class="btn-hud-back" id="btnBackToMap">← Back to Map</button>
        <div class="zone-active-pill" id="hudZoneTitle">Main Stage & Performance Lawn</div>
        <div class="hud-actions">
          <button class="btn-hud-toggle" id="btnAutoRotate">🔄 Auto Rotate</button>
          <button class="btn-hud-toggle" id="btnWatchTour360">🌀 Watch Progress Tour</button>
        </div>
      </div>
      <aside class="hud-inventory-drawer">
        <div class="drawer-title">
          <span>360° Customizable Objects</span>
          <small>Click any item to interchange</small>
        </div>
        <div class="slots-list" id="hudSlotsList"></div>
      </aside>
      <div class="hud-bottom-bar">
        <span class="hud-hint">
          🖱️ <strong>Drag mouse / Touch</strong> to rotate 360° • 📜 <strong>Scroll</strong> to zoom • 🎯 <strong>Click Hotspots</strong> to interchange
        </span>
      </div>
    </section>

    <!-- View 3: 📐 Interactive 2D/3D Site Floor Plan Editor -->
    <section id="floorPlanContainer" class="view-section hidden"></section>

    <!-- View 4: 📊 Event Telemetry & Analytics Dashboard -->
    <section id="analyticsContainer" class="view-section hidden"></section>

    <!-- View 5: 📁 Saved Proposals & B2B Printable Contract Exporter -->
    <section id="proposalsContainer" class="view-section hidden"></section>

    <!-- View 6: 📅 Multi-Day Event Timeline Planner -->
    <section id="timelineContainer" class="view-section hidden"></section>

    <!-- View 7: 👥 Guest Seating Chart Builder -->
    <section id="seatingContainer" class="view-section hidden"></section>

    <!-- View 8: 📊 Vendor Management -->
    <section id="vendorContainer" class="view-section hidden"></section>

    <!-- View 9: 📦 Inventory Tracker -->
    <section id="inventoryContainer" class="view-section hidden"></section>

    <!-- View 10: 📆 Calendar & Date Booking -->
    <section id="calendarContainer" class="view-section hidden"></section>

    <!-- View 11: 📈 Revenue Analytics -->
    <section id="revenueContainer" class="view-section hidden"></section>

    <!-- View 12: ⭐ Testimonial Wall -->
    <section id="testimonialContainer" class="view-section hidden"></section>

    <!-- View 13: 🎵 Playlist Builder -->
    <section id="playlistContainer" class="view-section hidden"></section>
  </main>

  <!-- Persistent Floating Cost Card -->
  <div id="costCardContainer"></div>

  <!-- Item Swapper Modal Container -->
  <div id="swapperModalContainer"></div>

  <!-- Venue Options Menu Modal Container -->
  <div id="venueMenuModalContainer"></div>

  <!-- Cart & Payment Checkout Modal Container -->
  <div id="cartModalContainer"></div>

  <!-- Color Theme Designer Modal Container -->
  <div id="colorThemeContainer"></div>

  <!-- Before/After Compare Modal Container -->
  <div id="compareContainer"></div>

  <!-- Collaboration Mode Modal Container -->
  <div id="collabContainer"></div>

  <!-- Style Library Modal Container -->
  <div id="styleLibraryContainer"></div>

  <!-- Zone Notes Modal Container -->
  <div id="zoneNotesContainer"></div>

  <!-- Weather Simulator Panel Container -->
  <div id="weatherSimContainer"></div>

  <!-- Walkthrough Video Export Modal Container -->
  <div id="videoExportContainer"></div>

  <!-- AR QR Generator Modal Container -->
  <div id="arQRContainer"></div>

  <!-- Mood Board Matcher Modal Container -->
  <div id="moodBoardContainer"></div>

  <!-- E-Signature Flow Modal Container -->
  <div id="eSignatureContainer"></div>

  <!-- Notification Center Dropdown Container -->
  <div id="notificationContainer"></div>

  <!-- Invoice Generator Modal Container -->
  <div id="invoiceContainer"></div>

  <!-- Budget Optimizer Modal Container -->
  <div id="budgetOptContainer"></div>

  <!-- Event Brief Generator Modal Container -->
  <div id="briefGenContainer"></div>

  <!-- Custom Event Brief Wizard Modal Container -->
  <div id="customBriefWizardContainer"></div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
