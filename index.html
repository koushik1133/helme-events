<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helm Events 360° | Venue &amp; India Events Studio</title>

  <!-- Identity -->
  <meta name="description" content="Helm Events 360° — walk clients through venue previews, swap decor live and quote the exact cost in rupees before anyone signs." />
  <meta name="theme-color" content="#0B1220" />
  <meta name="author" content="Helm Events" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/site.webmanifest" />

  <!--
    SET THE PRODUCTION DOMAIN BEFORE LAUNCH.
    Replace every REPLACE-WITH-PRODUCTION-DOMAIN below with the real host
    (e.g. helm-events.vercel.app). Social crawlers do NOT resolve relative
    URLs — leave these unset and a shared link gets no preview image at all.
  -->
  <link rel="canonical" href="https://REPLACE-WITH-PRODUCTION-DOMAIN/" />

  <!-- Open Graph: WhatsApp, LinkedIn, Slack, iMessage -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Helm Events" />
  <meta property="og:title" content="Helm Events 360° — see the venue before you book it" />
  <meta property="og:description" content="Walk clients through venue previews, swap decor live and quote the exact cost in rupees before anyone signs." />
  <meta property="og:url" content="https://REPLACE-WITH-PRODUCTION-DOMAIN/" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:image" content="https://REPLACE-WITH-PRODUCTION-DOMAIN/images/venue_map_aerial.jpg" />
  <meta property="og:image:width" content="1376" />
  <meta property="og:image:height" content="768" />
  <meta property="og:image:alt" content="Aerial view of a Helm Events venue with decor zones marked." />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Helm Events 360° — see the venue before you book it" />
  <meta name="twitter:description" content="Walk clients through venue previews, swap decor live and quote the exact cost in rupees before anyone signs." />
  <meta name="twitter:image" content="https://REPLACE-WITH-PRODUCTION-DOMAIN/images/venue_map_aerial.jpg" />
  <meta name="twitter:image:alt" content="Aerial view of a Helm Events venue with decor zones marked." />

  <!-- Google Fonts: Inter (Helm Events Font Stack) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!--
    Sign-in gate. This is a DEMO persona chooser, not authentication — there is no
    backend and nothing here secures data. src/auth/ enforces the permission matrix
    so the model transfers unchanged when a backend lands, but the app says plainly
    what it is.
  -->
  <div id="workspace">
  <!-- Helm Events Navbar Header -->
  <header class="app-navbar">
    <div class="nav-brand">
      <img class="helm-logo" src="/images/helm-logo.png" alt="Helm Events" width="120" height="48" />
      <div class="brand-text">
        <h1 class="logo-title">Helm Events</h1>
        <span class="logo-subtitle">360° Venue & India Events Studio</span>
      </div>
    </div>

    <!-- Primary section switcher: the workspace this person is in right now. -->
    <nav class="section-switcher" id="sectionSwitcher" aria-label="Workspace sections">
      <button class="section-tab active" data-section="home" id="sectionHome"><span>Home</span></button>
      <button class="section-tab" data-section="clients" id="sectionClients"><span>Clients</span></button>
      <button class="section-tab" data-section="deals" id="sectionDeals"><span>Pipeline</span></button>
      <button class="section-tab" data-section="payments" id="sectionPayments"><span>Payments</span></button>
      <button class="section-tab" data-section="studio" id="sectionStudio"><span>Studio</span></button>
      <button class="section-tab" data-section="plan" id="sectionPlan"><span>Plan</span></button>
    </nav>

    <!-- Who am I signed in as — always visible, always switchable. -->
    <div id="roleBadgeSlot" class="role-badge-slot"></div>

    <!-- Navigation View Switcher (Center Segmented Pill) -->
    <div class="studio-only" id="studioNavGroup">
    <nav class="view-toggle-group" aria-label="Studio views">
      <button class="nav-tab active" id="tabMapView"><span>Venue</span></button>
      <button class="nav-tab" id="tab360View"><span>360° Studio</span></button>
      <button class="nav-tab" id="tabFloorPlanView"><span>Floor plan</span></button>
    </nav>
    </div>

    <div class="plan-only hidden" id="planNavGroup">
    <nav class="view-toggle-group" aria-label="Plan views">
      <button class="nav-tab active" id="tabTimelineView"><span>Run sheet</span></button>
      <button class="nav-tab" id="tabSeatingView"><span>Seating</span></button>
      <button class="nav-tab" id="tabAnalyticsView"><span>Build</span></button>
      <button class="nav-tab" id="tabVendorsView"><span>Vendors</span></button>
      <button class="nav-tab" id="tabInventoryView"><span>Inventory</span></button>
      <button class="nav-tab" id="tabCalendarView"><span>Calendar</span></button>
      <button class="nav-tab" id="tabProposalsView"><span>Proposals</span></button>
    </nav>
    </div>

    <!-- Quick Search Input Bar -->
    <div class="nav-search-wrapper">
      <span class="nav-search-icon">🔍</span>
      <input type="search" id="globalNavSearch" class="nav-search-input" aria-label="Quick search rooms, furniture and vendors" placeholder="Quick search rooms, furniture, vendors..." />
    </div>

    <!-- Action Buttons Group (Right Pill Bar) -->
    <div class="nav-actions-group">
      <span class="studio-only-actions" id="studioOnlyActions">
      <button class="nav-action-btn btn-3d-editor" id="btnOpen3DEditor" aria-label="Open the interactive 3D space editor" title="Interactive 3D Real-Time Space Editor">
        <span>🎮 3D Editor</span>
      </button>

      <button class="nav-action-btn btn-event-details" id="btnEventDetails" aria-label="Edit event details: client, dates, guest count and budget" title="Event details — client, dates, guests, budget">
        <span>📝 Event Details</span>
      </button>

      <button class="nav-action-btn btn-custom-brief" id="btnCustomBrief" aria-label="Open the custom event brief wizard" title="Dynamic Custom Event Setup Wizard">
        <span>📋 Custom Brief</span>
      </button>

      <button class="nav-action-btn btn-ai-builder" id="btnAIBuilder" aria-label="Build a complete layout from the event brief" title="Build a complete layout from the event brief">
        <span>⚡ Instant Layout</span>
      </button>

      <button class="nav-action-btn btn-features-toggle" id="btnToggleFeatures" aria-expanded="false" aria-controls="featureToolbar" aria-label="Show more features" title="More Features">
        <span>🧩 Features</span>
      </button>

      <button class="nav-action-btn btn-venue-menu" id="btnOpenVenueMenu" aria-label="Open venue options menu">
        <span>📖 Menu</span>
      </button>

      <button class="nav-action-btn btn-cart-nav" id="btnOpenCart" aria-label="Open cart and checkout">
        <span>🛒 Cart</span>
      </button>

      </span>

      <button class="nav-action-btn btn-notification-bell" id="btnNotifications" aria-label="Notifications" title="Notifications">
        <span>🔔</span>
        <span class="notif-badge" id="notifBadge" role="status" aria-live="polite" aria-atomic="true" hidden></span>
      </button>

      <button class="nav-action-btn btn-sound-toggle" id="btnSoundToggle" aria-label="Toggle ambient sound">
        <span id="soundIcon">🔇</span> <span id="soundLabel">Sound: OFF</span>
      </button>

      <button class="theme-mode-toggle" id="themeModeToggle" aria-label="Toggle Theme">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
        <span class="theme-mode-label">Dark</span>
      </button>
    </div>

    <!-- Theme pinned outside scroll row so it is always reachable -->
    <div class="preset-popover-wrapper nav-theme-pin" id="presetPopoverWrapper">
      <button class="preset-trigger-btn" id="btnPresetDropdown" aria-label="Select Theme Preset" aria-haspopup="true" aria-expanded="false">
        <span class="preset-label-tag">Theme:</span>
        <span id="presetCurrentName" class="preset-current-val">👑 Royal Gold</span>
        <span class="preset-chevron">▾</span>
      </button>
      <div class="preset-popover-menu hidden" id="presetPopoverMenu" role="menu">
        <div class="preset-menu-item active" data-value="royal" role="menuitem">
          <span class="item-icon">👑</span> <span class="item-name">Royal Gold Wedding</span> <span class="item-check">✓</span>
        </div>
        <div class="preset-menu-item" data-value="cyber" role="menuitem">
          <span class="item-icon">⚡</span> <span class="item-name">Cyber Neon Gala</span> <span class="item-check"></span>
        </div>
        <div class="preset-menu-item" data-value="garden" role="menuitem">
          <span class="item-icon">🌿</span> <span class="item-name">Garden Boho Party</span> <span class="item-check"></span>
        </div>
        <div class="preset-menu-item" data-value="minimal" role="menuitem">
          <span class="item-icon">🤍</span> <span class="item-name">Minimalist Platinum</span> <span class="item-check"></span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="app-viewport">
    <!-- Role home. The front door for everyone who signs in. -->
    <section id="homeSection" class="app-section active"></section>

    <!-- CRM -->
    <section id="clientsSection" class="app-section hidden"></section>
    <section id="dealsSection" class="app-section hidden"></section>
    <section id="paymentsSection" class="app-section hidden"></section>

    <!-- Design Studio: the 360 venue planner and everything around it. -->
    <div id="studioSection" class="app-section hidden">
    <!-- View 1: Interactive Aerial Venue Map -->
    <section id="mapViewContainer" class="view-section active"></section>

    <!-- View 2: Full 360° Photo WebGL Studio -->
    <section id="studio360Container" class="view-section hidden">
      <!--
        View mode is the default and NOTHING overlaps the venue. The mode bar is a
        thin strip at the top; the edit panel docks to the right and SHRINKS the
        canvas rather than covering it, which is the whole point — you watch the
        venue change while you edit it.
      -->
      <div class="studio-stage" id="studioStage" data-mode="view">
        <div class="studio-canvas-wrap">
          <div id="canvas360Holder" class="canvas-360-holder"></div>
          <div id="studioModeBarHost" class="studio-mode-bar-host"></div>
        </div>
        <div id="studioEditPanelHost" class="studio-edit-panel-host" hidden></div>
      </div>
    </section>

    <!-- View 3: 📐 Interactive 2D/3D Site Floor Plan Editor -->
    <section id="floorPlanContainer" class="view-section hidden"></section>








    <!-- View 12: ⭐ Testimonial Wall -->
    <section id="testimonialContainer" class="view-section hidden"></section>

    <!-- View 13: 🎵 Playlist Builder -->
    <section id="playlistContainer" class="view-section hidden"></section>

    </div><!-- /#studioSection -->

    <!-- Plan: the delivery tools. These were cluttering the Design Studio, where a
         run sheet never belonged — it is not a design surface. -->
    <div id="planSection" class="app-section hidden">
      <section id="analyticsContainer" class="view-section hidden"></section>
      <section id="proposalsContainer" class="view-section hidden"></section>
      <section id="timelineContainer" class="view-section hidden"></section>
      <section id="seatingContainer" class="view-section hidden"></section>
      <section id="vendorContainer" class="view-section hidden"></section>
      <section id="inventoryContainer" class="view-section hidden"></section>
      <section id="calendarContainer" class="view-section hidden"></section>
    </div>

  </main>

  <!-- Persistent Floating Cost Card -->
  <div id="costCardContainer"></div>

  <!-- Item Swapper Modal Container -->
  <div id="swapperModalContainer"></div>

  <!-- Venue Options Menu Modal Container -->
  <div id="venueMenuModalContainer"></div>

  <!-- Cart & Payment Checkout Modal Container -->
  <div id="cartModalContainer"></div>

  <!-- Before/After Compare Modal Container -->
  <div id="compareContainer"></div>

  <!-- Collaboration Mode Modal Container -->
  <div id="collabContainer"></div>

  <!-- Style Library Modal Container -->
  <div id="styleLibraryContainer"></div>

  <!-- Zone Notes Modal Container -->
  <div id="zoneNotesContainer"></div>

  <!-- Walkthrough Video Export Modal Container -->
  <div id="videoExportContainer"></div>

  <!-- AR QR Generator Modal Container -->
  <div id="arQRContainer"></div>

  <!-- Mood Board Matcher Modal Container -->
  <div id="moodBoardContainer"></div>

  <!-- E-Signature Flow Modal Container -->
  <div id="eSignatureContainer"></div>

  <!-- Notification Center Dropdown Container -->
  <div id="notificationContainer"></div>

  <!-- Invoice Generator Modal Container -->
  <div id="invoiceContainer"></div>

  <!-- Budget Optimizer Modal Container -->
  <div id="budgetOptContainer"></div>

  <!-- Event Brief Generator Modal Container -->
  <div id="briefGenContainer"></div>

  <!-- Custom Event Brief Wizard Modal Container -->
  <div id="customBriefWizardContainer"></div>

  <!-- Interactive 3D Real-Time Space Editor Container -->
  <div id="threeDEditorContainer"></div>

  <!-- Event Details Panel Container -->
  <div id="eventDetailsContainer"></div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

  <!-- "Sign in as" persona screen — a full-viewport overlay, shown when signed out -->
  <div id="signInContainer" hidden></div>

  <!-- Roles & permissions transparency screen -->
  <div id="rolesMatrixContainer" hidden></div>

  <p class="demo-disclaimer">
    Demo workspace — roles shape what you see, they do not secure data.
    Everything is stored in this browser.
  </p>
  </div><!-- /#workspace -->

  <script type="module" src="/src/main.js"></script>
</body>
</html>
